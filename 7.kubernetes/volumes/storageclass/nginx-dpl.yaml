apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-dpl
spec:
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
      - name: nginx-app
        image: nginx:latest
        volumeMounts: 
          - name: data 
            mountPath: /usr/share/nginx/html
        ports:
        - containerPort: 80
      volumes: 
        - name: data 
          persistentVolumeClaim: 
            claimName: my-app-data